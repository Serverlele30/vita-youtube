# PS-Vita-YouTube: ytv.serverlele.de (eingebunden aus http.conf, getrennt von Twitch)
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ytv.serverlele.de;

  ssl_certificate     /etc/letsencrypt/live/ytv-rsa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ytv-rsa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA';
  ssl_prefer_server_ciphers on;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/letsencrypt-acme-challenge.conf;

  access_log /data/logs/vita-youtube_access.log proxy;
  access_log /data/logs/vita-youtube_timing.log vita_timing;
  error_log  /data/logs/vita-youtube_error.log info;

  location / {
    set $forward_scheme http;
    set $server         "127.0.0.1";
    set $port           8444;
    include conf.d/include/proxy.conf;
  }
}
